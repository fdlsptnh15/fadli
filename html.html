<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema Tabloid Koran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; background:#141312; padding:24px 14px 60px;
    display:flex; justify-content:center;
    font-family:'Space Mono',monospace;
  }

  .card{ width:100%; max-width:400px; }

  .t-tabloid{ background:#eee7d3; padding:14px 14px 16px; box-shadow:0 14px 30px rgba(0,0,0,.5); }

  .t-tabloid .repeat{
    font-family:'Space Mono',monospace; font-size:.42rem; color:#4a4640;
    white-space:nowrap; overflow:hidden; letter-spacing:.02em;
  }

  .t-tabloid .brand{
    font-family:'UnifrakturMaguntia',cursive; font-size:2.4rem;
    text-align:center; color:#1a1712; margin:2px 0; line-height:1;
  }

  .t-tabloid .rule{ height:2px; background:#231f1b; margin:3px 0 1px; }
  .t-tabloid .rule.thin{ height:1px; opacity:.6; }

  .t-tabloid .frame{
    margin-top:8px; border:1px solid #000; aspect-ratio:16/11;
    overflow:hidden;
  }
  .t-tabloid .frame img{ width:100%; height:100%; object-fit:cover; display:block; }

  .t-tabloid .headline{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:8px; color:#1a1712;
  }
  .t-tabloid .headline .show{
    font-family:'Bebas Neue',sans-serif; font-size:1.5rem; letter-spacing:.02em;
  }
  .t-tabloid .headline .tag{
    font-family:'Space Mono',monospace; font-size:.6rem; color:#8a3324; font-weight:700;
  }

  .t-tabloid .roster{ margin-top:10px; color:#1a1712; }
  .t-tabloid .roster .school{ font-size:.72rem; letter-spacing:.03em; }
  .t-tabloid .roster .classinfo{ font-size:.62rem; color:#4a4640; margin-top:1px; }
  .t-tabloid .roster ul{ list-style:none; margin:8px 0 0; padding:0; columns:2; column-gap:14px; }
  .t-tabloid .roster li{ font-size:.6rem; color:#332f28; margin-bottom:5px; break-inside:avoid; }
</style>
</head>
<body>

<div class="card">
  <div class="t-tabloid">
    <div class="repeat">The Daily News · The Daily News · The Daily News · The Daily News</div>
    <div class="brand">MEMORY</div>
    <div class="rule"></div>
    <div class="rule thin"></div>
    <div class="repeat">The Daily News · The Daily News · The Daily News · The Daily News</div>

    <div class="frame">
      <img src="lulusan 9.1.jpeg" alt="foto kelompok">
    </div>

    <div class="headline">
      <div class="show">SEMBILAN SATU</div>
      <div class="tag">MEMORY</div>
    </div>

    <div class="roster">
      <div class="school">SMP 2 SEPATAN — 2023</div>
      <div class="classinfo"> 9.1· Tahun Ajaran 2023/2024</div>
        <li>We didn't realize we were making memories, we just knew we were having fun.</li>
      </ul>
    </div>
  </div>
</div>

</body>
</html>
